    <script>
      (function () {
        var isExt = function (s) {
          return typeof s === 'string' && (s.indexOf('chrome-extension://') !== -1 || s.indexOf('moz-extension://') !== -1);
        };
        window.addEventListener(
          'error',
          function (e) {
            var stack = e && e.error && e.error.stack ? String(e.error.stack) : '';
            if (isExt(e && e.filename) || isExt(stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var reason = e && e.reason;
            var stack = reason && reason.stack ? String(reason.stack) : '';
            if (isExt(stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
